<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Hosting Gratis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            color: #18392b;
            text-align: center;
            padding: 70px 20px;
        }
        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #0001;
        }
        h1 { color: #15803d; }
        p { line-height: 1.8; }
        .button {
            display: inline-block;
            background: #15803d;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Website Saya Berhasil Online!</h1>
        <p>Halo! Ini adalah website sederhana yang saya buat
        dan publikasikan menggunakan GitHub Pages.</p>
        <p>Hosting: GitHub Pages</p>
        <p>Status: Website berhasil dibuat.</p>
        <a class="button" href="https://github.com/"
           target="_blank">Kunjungi GitHub</a>
    </div>
</body>
</html>
